name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast lane: the pure engine. No simulator, runs on every push/PR.
  engine:
    name: EtudeKit (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Test
        run: swift test

  # Slow lane: app + UI tests on the simulator. Heavier; suitable for nightly if it
  # becomes a bottleneck (schedule left commented until the app target is fleshed out).
  #
  # Runner notes: the UI tests are Swift-6-strict and need the iOS 26 SDK, so this
  # job runs on macos-26. The image's default Xcode (26.6) ships with NO simulator
  # runtimes, so we pin the newest Xcode that bundles one (26.5) and let xcodebuild
  # resolve the OS version rather than pinning one the runner may not have.
  #
  # Two devices: the iPhone covers the compact size class, the iPad the regular
  # one. The library's split-view tests only run in a regular size class (they
  # skip on a phone by design), so without the iPad they would never run here.
  app:
    name: Etude app + UI tests (${{ matrix.device }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        device: ['iPhone 17 Pro', 'iPad Pro 11-inch (M5)']
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode with a bundled simulator runtime
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26.5*.app | head -1)"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: App/Etude
        run: xcodegen generate
      # The runner sometimes starts before its simulator runtime is mounted,
      # and xcodebuild then reports "Unable to find a device" with nothing
      # wrong in the code. Wait for the device, restarting the simulator
      # service once, and fail with a plain message if it never appears.
      - name: Wait for the simulator
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          for attempt in $(seq 1 18); do
            if xcrun simctl list devices available | grep -qF "    $DEVICE ("; then
              echo "Found $DEVICE"
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "Restarting the simulator service"
              sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService || true
            fi
            echo "Waiting for $DEVICE ($attempt/18)"
            sleep 10
          done
          echo "::error::The runner has no '$DEVICE' simulator. This is the runner, not the tests: rerun the job."
          xcrun simctl list devices available
          exit 1
      - name: Build & test
        working-directory: App/Etude
        run: |
          xcodebuild test \
            -scheme Etude \
            -destination "platform=iOS Simulator,name=${{ matrix.device }}" \
            CODE_SIGNING_ALLOWED=NO
